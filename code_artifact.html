<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Учебный календарь</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* gray-100 */
            -webkit-tap-highlight-color: transparent;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: 1.2fr repeat(7, 1fr);
            gap: 2px;
            background-color: #e5e7eb; /* gray-200 for borders */
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            overflow: hidden;
        }
        .calendar-cell {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            font-size: 0.875rem;
        }
        .week-cell {
            background-color: #eff6ff; /* blue-50 */
            color: #2563eb; /* blue-600 */
            font-weight: 600;
            font-size: 0.75rem;
            aspect-ratio: auto;
        }
        .header-cell {
            background-color: #f9fafb; /* gray-50 */
            font-weight: 500;
            color: #6b7280; /* gray-500 */
            font-size: 0.75rem;
            padding: 0.5rem 0;
            aspect-ratio: auto;
        }
        .today-cell {
            background-color: #3b82f6; /* blue-500 */
            color: white;
            font-weight: bold;
            border-radius: 9999px;
            width: 80%;
            height: 80%;
            margin: auto;
        }
        .other-month {
            color: #9ca3af; /* gray-400 */
        }
    </style>
</head>
<body class="text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col">
        
        <!-- Верхняя панель: Текущая учебная неделя -->
        <div class="bg-blue-600 text-white p-6 rounded-b-3xl shadow-md z-10 relative">
            <h1 class="text-blue-100 text-sm font-medium uppercase tracking-wider mb-1 text-center">Сейчас идёт</h1>
            <div class="text-4xl font-bold text-center flex flex-col items-center">
                <span id="current-week-number" class="text-6xl mb-1">...</span>
                <span class="text-lg font-medium">учебная неделя</span>
            </div>
            <p id="current-date-text" class="text-center text-blue-200 mt-3 text-sm"></p>
        </div>

        <!-- Навигация по календарю -->
        <div class="flex-1 px-4 py-6 flex flex-col">
            <div class="flex justify-between items-center mb-6">
                <button onclick="changeMonth(-1)" class="p-2 rounded-full hover:bg-gray-100 active:bg-gray-200 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 text-gray-600">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                    </svg>
                </button>
                <h2 id="month-year-display" class="text-lg font-bold capitalize text-gray-800"></h2>
                <button onclick="changeMonth(1)" class="p-2 rounded-full hover:bg-gray-100 active:bg-gray-200 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6 text-gray-600">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
                    </svg>
                </button>
            </div>

            <!-- Сетка календаря -->
            <div class="calendar-grid" id="calendar-grid">
                <!-- Заголовки добавляются через JS -->
            </div>
            
            <div class="mt-6 flex items-center justify-center gap-2">
                <button onclick="resetToToday()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-full text-sm font-medium hover:bg-gray-200 transition">
                    Вернуться к сегодня
                </button>
            </div>
        </div>

    </div>

    <script>
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const monthNamesGenitive = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
        const dayNames = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
        
        let currentDate = new Date();
        // Используем отдельную переменную для отображаемого месяца в календаре
        let displayDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);

        function init() {
            updateCurrentWeekHero();
            renderCalendar();
        }

        // Вычисляет, с какого года начинается текущий учебный год для заданной даты
        function getAcademicYearStartYear(targetDate) {
            const year = targetDate.getFullYear();
            
            // Находим 1 сентября текущего календарного года
            const sept1ThisYear = new Date(year, 8, 1); // Месяц 8 - это сентябрь
            
            // Находим понедельник недели, на которую выпадает 1 сентября
            let dayOfWeek = sept1ThisYear.getDay();
            dayOfWeek = dayOfWeek === 0 ? 7 : dayOfWeek; // 1 (Пн) ... 7 (Вс)
            
            const week1StartThisYear = new Date(sept1ThisYear);
            week1StartThisYear.setDate(sept1ThisYear.getDate() - (dayOfWeek - 1));
            week1StartThisYear.setHours(0, 0, 0, 0);

            // Если целевая дата меньше начала первой недели этого года, значит это прошлый учебный год
            if (targetDate.getTime() < week1StartThisYear.getTime()) {
                return year - 1;
            } else {
                return year;
            }
        }

        // Вычисляет номер учебной недели для заданной даты
        function getAcademicWeek(date) {
            const target = new Date(date);
            target.setHours(0, 0, 0, 0);

            const startYear = getAcademicYearStartYear(target);
            const sept1 = new Date(startYear, 8, 1);
            
            let dayOfWeek = sept1.getDay();
            dayOfWeek = dayOfWeek === 0 ? 7 : dayOfWeek;
            
            const week1Start = new Date(sept1);
            week1Start.setDate(sept1.getDate() - (dayOfWeek - 1));
            week1Start.setHours(0, 0, 0, 0);

            const diffTime = target.getTime() - week1Start.getTime();
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            
            return Math.floor(diffDays / 7) + 1;
        }

        function updateCurrentWeekHero() {
            const today = new Date();
            const weekNum = getAcademicWeek(today);
            document.getElementById('current-week-number').textContent = weekNum;
            document.getElementById('current-date-text').textContent = 
                `Сегодня: ${today.getDate()} ${monthNamesGenitive[today.getMonth()]} ${today.getFullYear()}`;
        }

        function changeMonth(offset) {
            displayDate.setMonth(displayDate.getMonth() + offset);
            renderCalendar();
        }

        function resetToToday() {
            displayDate = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1);
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const monthYearDisplay = document.getElementById('month-year-display');
            
            grid.innerHTML = '';
            monthYearDisplay.textContent = `${monthNames[displayDate.getMonth()]} ${displayDate.getFullYear()}`;

            // Заголовки (Нед. + Дни недели)
            const headers = ['Нед.', ...dayNames];
            headers.forEach(text => {
                const cell = document.createElement('div');
                cell.className = 'calendar-cell header-cell';
                cell.textContent = text;
                grid.appendChild(cell);
            });

            const year = displayDate.getFullYear();
            const month = displayDate.getMonth();
            
            const firstDayOfMonth = new Date(year, month, 1);
            const lastDayOfMonth = new Date(year, month + 1, 0);
            
            let startDayOfWeek = firstDayOfMonth.getDay();
            startDayOfWeek = startDayOfWeek === 0 ? 7 : startDayOfWeek;

            // Собираем все дни, которые нужно отобразить (с учетом предыдущего и следующего месяцев)
            let days = [];
            
            // Дни предыдущего месяца
            const prevMonthDays = startDayOfWeek - 1;
            for (let i = prevMonthDays - 1; i >= 0; i--) {
                days.push(new Date(year, month, -i));
            }
            
            // Дни текущего месяца
            for (let i = 1; i <= lastDayOfMonth.getDate(); i++) {
                days.push(new Date(year, month, i));
            }
            
            // Дни следующего месяца (дополняем до целых недель)
            const remainingDays = 7 - (days.length % 7);
            if (remainingDays < 7) {
                for (let i = 1; i <= remainingDays; i++) {
                    days.push(new Date(year, month + 1, i));
                }
            }

            // Рендерим по неделям
            const totalWeeks = days.length / 7;
            let currentDayIndex = 0;

            for (let w = 0; w < totalWeeks; w++) {
                // Берем четверг этой недели для точного определения номера недели
                // (или любой день этой недели, так как они в одной неделе)
                const weekReferenceDate = days[currentDayIndex];
                const weekNum = getAcademicWeek(weekReferenceDate);

                // Ячейка номера недели
                const weekCell = document.createElement('div');
                weekCell.className = 'calendar-cell week-cell';
                weekCell.textContent = weekNum;
                grid.appendChild(weekCell);

                // Ячейки дней недели
                for (let d = 0; d < 7; d++) {
                    const dateObj = days[currentDayIndex];
                    const cell = document.createElement('div');
                    cell.className = 'calendar-cell';
                    
                    const isToday = dateObj.toDateString() === currentDate.toDateString();
                    const isCurrentMonth = dateObj.getMonth() === month;

                    let innerSpan = document.createElement('span');
                    innerSpan.textContent = dateObj.getDate();
                    
                    if (isToday) {
                        innerSpan.className = 'today-cell flex items-center justify-center';
                    } else if (!isCurrentMonth) {
                        innerSpan.className = 'other-month';
                    }
                    
                    cell.appendChild(innerSpan);
                    grid.appendChild(cell);
                    
                    currentDayIndex++;
                }
            }
        }

        // Запуск
        init();
    </script>
</body>
</html>
